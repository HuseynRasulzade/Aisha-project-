<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f8f9d">
  <title>Health — Sakina</title>
  <meta name="description" content="Water, sleep, medication reminders, cycle tracking and gentle movement.">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <script src="gate.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="health">
<div id="app-header"></div>

<main>
  <section class="page-head">
    <p class="eyebrow">Wellness</p>
    <h1>Look after your body</h1>
    <p class="muted">Small daily basics support a steadier mind.</p>
  </section>

  <div class="tabs" role="tablist">
    <button class="on" data-tab="water"><i data-icon="droplet"></i>Water &amp; sleep</button>
    <button data-tab="meds"><i data-icon="pill"></i>Medication</button>
    <button data-tab="cycle"><i data-icon="calendar"></i>Cycle</button>
    <button data-tab="yoga"><i data-icon="person"></i>Yoga</button>
  </div>

  <section class="tabpanel on" id="tab-water">
    <h2 class="sub">Water today</h2>
    <div class="panel center">
      <div class="glasses" id="glasses" data-dyn></div>
      <p id="waterTxt" class="muted" data-dyn></p>
      <div class="row-center">
        <button class="btn btn-soft icon-btn" id="wMinus" aria-label="Less"><i data-icon="minus"></i></button>
        <button class="btn btn-dark" id="wPlus"><i data-icon="plus"></i>Add a glass</button>
      </div>
    </div>

    <h2 class="sub">Sleep last night</h2>
    <div class="panel">
      <div class="range-row">
        <input type="range" id="sleepRange" min="3" max="12" step="0.5" value="7">
        <strong id="sleepVal" data-dyn>7 h</strong>
      </div>
      <button class="btn btn-dark" id="sleepSave">Save</button>
      <div class="bars small-bars" id="sleepBars" data-dyn></div>
    </div>
  </section>

  <section class="tabpanel" id="tab-meds">
    <div class="panel row-form">
      <input class="inp" id="mName" data-ph="Medication name">
      <input class="inp time" id="mTime" type="time" value="09:00">
      <button class="btn btn-dark" id="mAdd"><i data-icon="plus"></i>Add</button>
    </div>
    <div id="mList" class="list" data-dyn></div>
    <p class="muted small center">Reminders are stored on this device only. Follow your clinician's instructions.</p>
  </section>

  <section class="tabpanel" id="tab-cycle">
    <div class="panel">
      <label class="lbl" for="cStart">First day of last period</label>
      <input class="inp" id="cStart" type="date">
      <label class="lbl" for="cLen">Cycle length (days)</label>
      <input class="inp" id="cLen" type="number" min="20" max="45" value="28">
      <button class="btn btn-dark" id="cSave">Calculate</button>
      <p id="cOut" class="result" data-dyn></p>
    </div>
  </section>

  <section class="tabpanel" id="tab-yoga">
    <div class="grid g2" id="yogaList" data-dyn></div>
  </section>
</main>

<div id="app-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="i18n-pages.js"></script>
<script src="i18n-ai.js"></script>
<script src="common.js"></script>
<script src="auth.js"></script>
<script src="pages.js"></script>
</body>
</html>
